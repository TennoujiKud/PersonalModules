name: 插件模块跳转
description:
 色鸡 可莉插件中心跳转到 Egern改，原作者IBL3ND
icon: https://iili.io/BDPVJ1I.png
homepage: https://hub.kelee.one
body_rewrites:
  - response_regex:
      match: https://(pluginhub|hub)\.kelee\.one/
      find: loon://import\?plugin=
      replace: egern:///modules/new?url=
  - response_regex:
      match: https://surge\.qingr\.moe/
      find: surge:///install-module\?url=
      replace: egern:///modules/new?url=
  - response_regex:
      match: ^raw\.githubusercontent\.com\/sooyaaabo\/LoonLab\/.*\/Plugin\/.*\.json$
      find: loon://import\?plugin=
      replace: egern:///modules/new?url=
  - response_regex:
      match:  ^kelvinlab\.wuyra\.com\/list\.json$
      find: loon://import\?plugin=
      replace: egern:///modules/new?url=
  - response_regex:
      match: ^kelvinlab\.wuyra\.com\/list\.json$
      find: surge:///install-module\?url=
      replace: egern:///modules/new?url=
mitm:
  hostnames:
    includes:
      - pluginhub.kelee.one
      - hub.kelee.one
      - surge.qingr.moe
      - raw.githubusercontent.com/sooyaaabo/LoonLab/
      - kelvinlab.wuyra.com

